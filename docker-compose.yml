version: '3.8'

services:
  frontend:
    image: oussama22444/frontend:latest
    build:
      context: ./pfe-project-front
      dockerfile: Dockerfile.frontend
    ports:
      - "8099:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    image: oussama22444/backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=pfedb
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - app-network
    restart: always

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=pfedb
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    restart: always

volumes:
  mysql-data:

networks:
  app-network:
    driver: bridge
